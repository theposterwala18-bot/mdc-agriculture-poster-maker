name: Verify Free Access Manager (no deployment)
on:
  push:
    branches:
      - feature/secure-free-access-manager-2026-11-16
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: JavaScript syntax and safety
        run: |
          node --check backend/payment-api.worker.js
          node --check dist/owner-free-access.js
          node --check dist/owner-dashboard.js
          node --check dist/poster-export.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const code=fs.readFileSync('backend/payment-api.worker.js','utf8');
          const html=fs.readFileSync('dist/owner-dashboard.html','utf8');
          for(const text of ['ownerGrantFreeAccess','ownerRevokeFreeAccess','currentFreeGrant','/owner/free-access/grant','/owner/free-access/revoke','accessType==="guest-free"','accessType==="owner-free"','expires_at>unixepoch()']){
            if(!code.includes(text))throw new Error('Missing '+text);
          }
          if(!html.includes('freeAccessForm')||!html.includes('owner-free-access.js'))throw Error('Free Access UI missing');
          if(code.includes('DROP TABLE')||code.includes('DELETE FROM payments')||code.includes('DELETE FROM daily_downloads'))throw Error('Unsafe DB mutation');
          JS
      - name: Migration and 10-email grant/revoke/expiry checks
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib, time
          db=sqlite3.connect(':memory:')
          db.executescript(pathlib.Path('cloudflare/Free-Access-Manager-v1.sql').read_text())
          now=int(time.time())
          query="""INSERT INTO free_access_grants(email,expires_at,revoked_at,created_by,created_at,updated_at)
          SELECT ?,?,NULL,?,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
          WHERE (SELECT COUNT(*) FROM free_access_grants WHERE revoked_at IS NULL AND expires_at>? AND email<>?)<10
          ON CONFLICT(email) DO UPDATE SET expires_at=excluded.expires_at,revoked_at=NULL,updated_at=CURRENT_TIMESTAMP,created_by=excluded.created_by
          WHERE (SELECT COUNT(*) FROM free_access_grants WHERE revoked_at IS NULL AND expires_at>? AND email<>excluded.email)<10"""
          def grant(email,days=7):
            before=db.total_changes
            db.execute(query,(email,now+days*86400,'owner@example.com',now,email,now))
            return db.total_changes-before
          for i in range(10):assert grant(f'guest{i}@example.com')==1
          assert grant('guest10@example.com')==0,'Exceeded active 10 email limit'
          assert grant('guest1@example.com',30)==1,'Extension should work'
          db.execute('UPDATE free_access_grants SET revoked_at=unixepoch() WHERE email=?',('guest2@example.com',))
          assert grant('guest10@example.com')==1,'Revoking should free slot'
          assert db.execute("SELECT count(*) FROM free_access_grants WHERE revoked_at IS NULL AND expires_at>unixepoch()").fetchone()[0]==10
          print('SQLite migration, max 10, revoke, extend checks passed')
          PY
      - name: Build website without deploying
        run: |
          npm ci
          npm run build
