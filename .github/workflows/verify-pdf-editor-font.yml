name: Verify PDF Editor Text Re-edit Regression
on:
  pull_request:
    paths:
      - "dist/pdf-text-editor.js"
      - "tests/pdf-editor-font-regression.test.mjs"
      - ".github/workflows/verify-pdf-editor-font.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --input-type=module --check < dist/pdf-text-editor.js
      - name: Regression checks
        run: |
          node --test tests/pdf-text-editor.test.mjs
          node --test tests/pdf-editor-font-regression.test.mjs
