name: Import user-approved Wedding Couple PNG assets
on:
  push:
    branches:
      - feature/built-in-wedding-couples-2026-11-12
    paths:
      - .github/workflows/import-user-wedding-png.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch three user-supplied transparent PNG illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets/wedding-couples
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IjcV661Y5TV4IxthQI3Vu7Rncf/acdc6943-4b44-40c3-b6d6-7f6db646f753.png' -o dist/assets/wedding-couples/royal-mint-couple.png
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IjcV661Y5TV4IxthQI3Vu7Rncf/2a7a1229-7cdb-453a-969e-4cda5a561085.png' -o dist/assets/wedding-couples/lavender-duo.png
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IjcV661Y5TV4IxthQI3Vu7Rncf/b013279e-c785-419d-985b-644824ff370b.png' -o dist/assets/wedding-couples/red-namaste-couple.png
          printf '%s\n' \
            '662a138d3f902a656301b51a20fd069732e18d39c487f2c5fa6ef02a2bbbbcf6  dist/assets/wedding-couples/royal-mint-couple.png' \
            '8c92a14a38cb62a5329df5092a2c17310dd41ecfdf094e15e3245c75bafae9a5  dist/assets/wedding-couples/lavender-duo.png' \
            'f9781340cd69327cbdd976f8c9d6b395d5a172171772fc821e6b7916b3dd7405  dist/assets/wedding-couples/red-namaste-couple.png' | sha256sum --check
          file dist/assets/wedding-couples/*.png
      - name: Store permanent image files in the website repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/assets/wedding-couples/*.png
          git commit -m 'Bundle three original Wedding PNG decorations'
          git push origin HEAD:feature/built-in-wedding-couples-2026-11-12
